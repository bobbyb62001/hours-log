<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hours Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #12161D;
    color: #E7E9EE;
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 480px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: #7A8497;
  }
  .header-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav button {
    background: none; border: none; color: #7A8497; cursor: pointer; padding: 4px;
    display: flex; font-size: 16px;
  }
  .month-nav button:hover { color: #E7E9EE; }
  .month-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    color: #C3C8D1; width: 108px; text-align: center;
  }
  h1 {
    font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600;
    letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-bottom: 24px;
  }
  h1 .slash { color: #7A8497; font-size: 18px; font-weight: 400; }
  h1 .unit { color: #7A8497; font-size: 14px; font-weight: 400; }
  #targetInput {
    width: 64px; background: transparent; border: none; border-bottom: 1px dashed #3A4150;
    color: #C9A227; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600;
    padding: 0 2px;
  }
  .meter-wrap { margin-bottom: 28px; }
  .meter-track {
    height: 8px; border-radius: 4px; background: #1D232D; overflow: hidden; border: 1px solid #262D39;
  }
  .meter-fill { height: 100%; transition: width 0.3s ease; }
  .meter-info {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7A8497;
  }
  .card {
    background: #1A1F28; border: 1px solid #262D39; border-radius: 10px; padding: 16px; margin-bottom: 24px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row:last-of-type { margin-bottom: 0; }
  input[type="date"], input[type="number"], input[type="text"] {
    background: #12161D; border: 1px solid #2C3340; border-radius: 6px; color: #E7E9EE;
    padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  input[type="date"], input[type="number"].hrs { font-family: 'IBM Plex Mono', monospace; }
  input::placeholder { color: #5B6472; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
  #dateInput { flex: 1; }
  #hoursInput { width: 70px; }
  #noteInput { flex: 1; }
  #addBtn {
    display: flex; align-items: center; gap: 6px; background: #C9A227; color: #12161D;
    border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  #addBtn:hover { opacity: 0.9; }
  .export-btn {
    flex: 1; background: #12161D; border: 1px solid #2C3340; color: #C3C8D1;
    border-radius: 6px; padding: 8px 10px; font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }
  .export-btn:hover { border-color: #C9A227; color: #C9A227; }
  .error { color: #D9736B; font-size: 12px; margin-top: 8px; }
  .empty { text-align: center; color: #5B6472; font-size: 13px; padding: 24px 0; }
  .entry-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid #1E2430;
  }
  .entry-date {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7A8497; width: 78px; flex-shrink: 0;
  }
  .entry-note { flex: 1; font-size: 13px; color: #C3C8D1; }
  .entry-note.empty-note { color: #4A5261; }
  .entry-hours {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #E7E9EE;
    width: 44px; text-align: right;
  }
  .del-btn {
    background: none; border: none; color: #7A8497; cursor: pointer; padding: 4px;
    opacity: 0; transition: opacity 0.15s;
  }
  .entry-row:hover .del-btn { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div class="eyebrow">HOURS LOG</div>
    <div class="month-nav">
      <button id="prevMonth" aria-label="Previous month">&#8592;</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth" aria-label="Next month">&#8594;</button>
    </div>
  </div>

  <h1>
    <span id="totalDisplay">0.0</span>
    <span class="slash">/</span>
    <input type="number" id="targetInput" min="0" step="0.5" />
    <span class="unit">hrs</span>
  </h1>

  <div class="meter-wrap">
    <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
    <div class="meter-info">
      <span id="entryCount">0 entries</span>
      <span id="remainingText">0 hrs remaining</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <input type="date" id="dateInput" />
      <input type="number" id="hoursInput" class="hrs" min="0" step="0.25" placeholder="hrs" />
    </div>
    <div class="row">
      <input type="text" id="noteInput" placeholder="What did you work on? (optional)" />
      <button id="addBtn">+ Log</button>
    </div>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="card" style="margin-bottom: 16px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #7A8497; margin-bottom: 10px;">
      IMPORT / CATCH UP
    </div>
    <textarea id="importBox" placeholder="Paste entries here, one per line:&#10;2026-07-01 — 9.50 hrs — optional note&#10;2026-07-02 — 10.00 hrs" rows="3" style="width:100%; background:#12161D; border:1px solid #2C3340; border-radius:6px; color:#E7E9EE; padding:8px 10px; font-size:12px; font-family:'IBM Plex Mono',monospace; resize:vertical; margin-bottom:8px;"></textarea>
    <div class="row" style="margin-bottom: 0;">
      <button id="importBtn" class="export-btn" style="background:#C9A227; color:#12161D; border-color:#C9A227;">Import entries</button>
    </div>
    <div class="error" id="importMsg"></div>
  </div>

  <div class="card" style="margin-bottom: 16px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #7A8497;">
        GITHUB BACKUP
      </div>
      <span id="ghStatusDot" style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7A8497;">not connected</span>
    </div>
    <div id="ghSetup">
      <div class="row">
        <input type="text" id="ghRepoInput" placeholder="username/repo (e.g. bobbyb62001/hours-log)" style="flex:1;" />
      </div>
      <div class="row" style="margin-bottom: 0;">
        <input type="password" id="ghTokenInput" placeholder="Paste GitHub token" style="flex:1;" />
        <button id="ghSaveBtn" class="export-btn" style="flex:0 0 auto; background:#C9A227; color:#12161D; border-color:#C9A227;">Save</button>
      </div>
    </div>
    <div class="row" id="ghActions" style="display:none; margin-top:8px; margin-bottom:0;">
      <button id="ghBackupBtn" class="export-btn" style="background:#C9A227; color:#12161D; border-color:#C9A227;">Backup now</button>
      <button id="ghRestoreBtn" class="export-btn">Restore from GitHub</button>
    </div>
    <div class="error" id="ghMsg"></div>
    <div id="ghForget" style="display:none; margin-top:6px;">
      <button id="ghForgetBtn" style="background:none; border:none; color:#5B6472; font-size:11px; text-decoration:underline; cursor:pointer; font-family:inherit;">Disconnect / change token</button>
    </div>
  </div>

  <div class="card" style="margin-bottom: 16px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #7A8497; margin-bottom: 10px;">
      EXPORT FOR TIME CARD
    </div>
    <div class="row">
      <button id="copyListBtn" class="export-btn">Copy list</button>
      <button id="copyTotalsBtn" class="export-btn">Copy totals only</button>
    </div>
    <div class="row" style="margin-bottom: 0;">
      <button id="backupBtn" class="export-btn">Copy full backup (all months)</button>
    </div>
    <div class="error" id="copyMsg" style="color:#7FD99A;"></div>
  </div>

  <div id="missingDaysBox" class="card" style="display:none; margin-bottom: 16px; border-color:#3A3020;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #C9A227; margin-bottom: 8px;">
      NO ENTRY LOGGED
    </div>
    <div id="missingDaysList" style="font-size: 13px; color: #C3C8D1; line-height: 1.6;"></div>
  </div>

  <div id="entriesList"></div>
</div>

<script>
  const STORAGE_KEY = "hourslog.entries";
  const TARGETS_KEY = "hourslog.targets";

  // Pulled from the 2026 corporate calendar (Work Hours column, sums to 2000 annual).
  const DEFAULT_TARGETS = {
    "2026-01": 160, "2026-02": 152, "2026-03": 176, "2026-04": 176,
    "2026-05": 160, "2026-06": 168, "2026-07": 176, "2026-08": 168,
    "2026-09": 168, "2026-10": 168, "2026-11": 152, "2026-12": 176,
  };

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  let entries = loadJSON(STORAGE_KEY, []);
  let targets = Object.assign({}, DEFAULT_TARGETS, loadJSON(TARGETS_KEY, {}));

  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function currentMonthKey() { return todayISO().slice(0, 7); }
  let viewMonth = currentMonthKey();

  function monthLabel(key) {
    const [y, m] = key.split("-").map(Number);
    const d = new Date(y, m - 1, 1);
    return d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }
  function shiftMonth(key, delta) {
    const [y, m] = key.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }
  function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  const dateInput = document.getElementById("dateInput");
  const hoursInput = document.getElementById("hoursInput");
  const noteInput = document.getElementById("noteInput");
  const targetInput = document.getElementById("targetInput");
  const errorMsg = document.getElementById("errorMsg");

  dateInput.value = todayISO();

  function render() {
    document.getElementById("monthLabel").textContent = monthLabel(viewMonth).toUpperCase();
    const target = targets[viewMonth] ?? 160;
    targetInput.value = target;

    const monthEntries = entries.filter(e => e.date.slice(0, 7) === viewMonth);
    const total = monthEntries.reduce((sum, e) => sum + Number(e.hours || 0), 0);
    const remaining = Math.max(target - total, 0);
    const pct = target > 0 ? Math.min((total / target) * 100, 100) : 0;
    const over = total > target;

    document.getElementById("totalDisplay").textContent = total.toFixed(1);
    const fill = document.getElementById("meterFill");
    fill.style.width = pct + "%";
    fill.style.background = over ? "#B33A3A" : "#C9A227";

    document.getElementById("entryCount").textContent =
      monthEntries.length + (monthEntries.length === 1 ? " entry" : " entries");
    const remainingText = document.getElementById("remainingText");
    remainingText.textContent = over
      ? `+${(total - target).toFixed(1)} hrs over`
      : `${remaining.toFixed(1)} hrs remaining`;
    remainingText.style.color = over ? "#D9736B" : "#7A8497";

    const sorted = [...monthEntries].sort((a, b) => (a.date < b.date ? 1 : -1));
    const list = document.getElementById("entriesList");
    list.innerHTML = "";
    if (sorted.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = `No hours logged for ${monthLabel(viewMonth)}.`;
      list.appendChild(empty);
    } else {
      sorted.forEach(e => {
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <div class="entry-date">${formatDate(e.date)}</div>
          <div class="entry-note ${e.note ? "" : "empty-note"}">${e.note ? escapeHtml(e.note) : "—"}</div>
          <div class="entry-hours">${Number(e.hours).toFixed(2)}</div>
          <button class="del-btn" data-id="${e.id}" aria-label="Delete">&#10005;</button>
        `;
        list.appendChild(row);
      });
      list.querySelectorAll(".del-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          entries = entries.filter(e => e.id !== btn.dataset.id);
          saveJSON(STORAGE_KEY, entries);
          render();
        });
      });
    }

    renderMissingDays(monthEntries);
  }

  // Flags weekdays (Mon-Fri) in the viewed month, up through today, that have no logged hours.
  function renderMissingDays(monthEntries) {
    const box = document.getElementById("missingDaysBox");
    const list = document.getElementById("missingDaysList");
    const [y, m] = viewMonth.split("-").map(Number);
    const today = new Date();
    const isCurrentOrPastMonth = viewMonth <= currentMonthKey();
    if (!isCurrentOrPastMonth) { box.style.display = "none"; return; }

    const lastDay = viewMonth === currentMonthKey()
      ? today.getDate()
      : new Date(y, m, 0).getDate();

    const loggedDates = new Set(monthEntries.map(e => e.date));
    const missing = [];
    for (let d = 1; d <= lastDay; d++) {
      const dateObj = new Date(y, m - 1, d);
      const dow = dateObj.getDay();
      if (dow === 0 || dow === 6) continue; // skip weekends
      const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      if (!loggedDates.has(iso)) missing.push(iso);
    }

    if (missing.length === 0) {
      box.style.display = "none";
    } else {
      box.style.display = "block";
      list.textContent = missing.map(iso => formatDate(iso)).join("  ·  ");
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    viewMonth = shiftMonth(viewMonth, -1);
    render();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    viewMonth = shiftMonth(viewMonth, 1);
    render();
  });

  targetInput.addEventListener("change", () => {
    const val = Math.max(0, Number(targetInput.value) || 0);
    targets[viewMonth] = val;
    saveJSON(TARGETS_KEY, targets);
    render();
  });

  document.getElementById("addBtn").addEventListener("click", addEntry);
  noteInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addEntry(); });

  function addEntry() {
    const h = parseFloat(hoursInput.value);
    errorMsg.textContent = "";
    if (!dateInput.value) {
      errorMsg.textContent = "Pick a date.";
      return;
    }
    if (!h || h <= 0) {
      errorMsg.textContent = "Enter hours greater than 0.";
      return;
    }
    entries.push({ id: uid(), date: dateInput.value, hours: h, note: noteInput.value.trim() });
    saveJSON(STORAGE_KEY, entries);
    hoursInput.value = "";
    noteInput.value = "";
    render();
  }

  const copyMsg = document.getElementById("copyMsg");
  function flashCopyMsg(text) {
    copyMsg.textContent = text;
    setTimeout(() => { copyMsg.textContent = ""; }, 2500);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => flashCopyMsg("Copied to clipboard."),
        () => fallbackCopy(text)
      );
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); flashCopyMsg("Copied to clipboard."); }
    catch (e) { flashCopyMsg("Couldn't copy — long-press the text below to copy manually."); }
    document.body.removeChild(ta);
  }

  document.getElementById("copyListBtn").addEventListener("click", () => {
    const monthEntries = entries.filter(e => e.date.slice(0, 7) === viewMonth)
      .sort((a, b) => (a.date < b.date ? -1 : 1));
    if (monthEntries.length === 0) { flashCopyMsg("No entries this month to copy."); return; }
    const lines = monthEntries.map(e =>
      `${e.date}  —  ${Number(e.hours).toFixed(2)} hrs${e.note ? "  —  " + e.note : ""}`
    );
    copyText(lines.join("\n"));
  });

  document.getElementById("copyTotalsBtn").addEventListener("click", () => {
    const monthEntries = entries.filter(e => e.date.slice(0, 7) === viewMonth)
      .sort((a, b) => (a.date < b.date ? -1 : 1));
    if (monthEntries.length === 0) { flashCopyMsg("No entries this month to copy."); return; }
    // Combine multiple entries on the same day into one daily total.
    const byDay = {};
    monthEntries.forEach(e => { byDay[e.date] = (byDay[e.date] || 0) + Number(e.hours); });
    const lines = Object.keys(byDay).sort().map(date => `${date}  —  ${byDay[date].toFixed(2)} hrs`);
    copyText(lines.join("\n"));
  });

  document.getElementById("backupBtn").addEventListener("click", () => {
    if (entries.length === 0) { flashCopyMsg("No entries logged yet."); return; }
    const sorted = [...entries].sort((a, b) => (a.date < b.date ? -1 : 1));
    const lines = sorted.map(e =>
      `${e.date}  —  ${Number(e.hours).toFixed(2)} hrs${e.note ? "  —  " + e.note : ""}`
    );
    const header = `HOURS LOG BACKUP — exported ${todayISO()}\n${"-".repeat(40)}\n`;
    copyText(header + lines.join("\n"));
  });

  const importMsg = document.getElementById("importMsg");
  document.getElementById("importBtn").addEventListener("click", () => {
    const raw = document.getElementById("importBox").value;
    importMsg.style.color = "#D9736B";
    if (!raw.trim()) { importMsg.textContent = "Paste some entries first."; return; }

    const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
    let added = 0, skipped = 0;

    lines.forEach(line => {
      // Skip header/divider lines from a pasted backup export
      if (/^HOURS LOG BACKUP/i.test(line) || /^-{5,}$/.test(line)) return;

      const dateMatch = line.match(/(\d{4}-\d{2}-\d{2})/);
      const hoursMatch = line.match(/(\d+(?:\.\d+)?)\s*hrs?/i);
      if (!dateMatch || !hoursMatch) { skipped++; return; }

      const date = dateMatch[1];
      const hours = parseFloat(hoursMatch[1]);
      if (!hours || hours <= 0) { skipped++; return; }

      // Note = anything after the hours segment, past a separator
      let note = "";
      const afterHours = line.slice(line.indexOf(hoursMatch[0]) + hoursMatch[0].length);
      const noteMatch = afterHours.match(/[—\-,]\s*(.+)/);
      if (noteMatch) note = noteMatch[1].trim();

      entries.push({ id: uid(), date, hours, note });
      added++;
    });

    saveJSON(STORAGE_KEY, entries);
    document.getElementById("importBox").value = "";
    importMsg.style.color = added > 0 ? "#7FD99A" : "#D9736B";
    importMsg.textContent = skipped > 0
      ? `Imported ${added} ${added === 1 ? "entry" : "entries"}, skipped ${skipped} unrecognized line${skipped === 1 ? "" : "s"}.`
      : `Imported ${added} ${added === 1 ? "entry" : "entries"}.`;
    render();
  });

  // ---- GitHub backup/restore ----
  const GH_REPO_KEY = "hourslog.gh.repo";
  const GH_TOKEN_KEY = "hourslog.gh.token";
  const GH_BACKUP_PATH = "backup.json";

  const ghSetup = document.getElementById("ghSetup");
  const ghActions = document.getElementById("ghActions");
  const ghForget = document.getElementById("ghForget");
  const ghStatusDot = document.getElementById("ghStatusDot");
  const ghMsg = document.getElementById("ghMsg");
  const ghRepoInput = document.getElementById("ghRepoInput");
  const ghTokenInput = document.getElementById("ghTokenInput");

  function ghCreds() {
    return { repo: localStorage.getItem(GH_REPO_KEY), token: localStorage.getItem(GH_TOKEN_KEY) };
  }
  function ghRefreshUI() {
    const { repo, token } = ghCreds();
    if (repo && token) {
      ghSetup.style.display = "none";
      ghActions.style.display = "flex";
      ghForget.style.display = "block";
      ghStatusDot.textContent = repo;
      ghStatusDot.style.color = "#7FD99A";
    } else {
      ghSetup.style.display = "block";
      ghActions.style.display = "none";
      ghForget.style.display = "none";
      ghStatusDot.textContent = "not connected";
      ghStatusDot.style.color = "#7A8497";
    }
  }
  function ghFlash(text, ok) {
    ghMsg.style.color = ok ? "#7FD99A" : "#D9736B";
    ghMsg.textContent = text;
  }
  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function base64ToUtf8(b64) {
    return decodeURIComponent(escape(atob(b64)));
  }

  document.getElementById("ghSaveBtn").addEventListener("click", () => {
    const repo = ghRepoInput.value.trim();
    const token = ghTokenInput.value.trim();
    if (!repo.includes("/")) { ghFlash("Repo should look like username/repo.", false); return; }
    if (!token) { ghFlash("Paste your token first.", false); return; }
    localStorage.setItem(GH_REPO_KEY, repo);
    localStorage.setItem(GH_TOKEN_KEY, token);
    ghTokenInput.value = "";
    ghFlash("Connected.", true);
    ghRefreshUI();
  });

  document.getElementById("ghForgetBtn").addEventListener("click", () => {
    localStorage.removeItem(GH_REPO_KEY);
    localStorage.removeItem(GH_TOKEN_KEY);
    ghRepoInput.value = "";
    ghFlash("Disconnected.", true);
    ghRefreshUI();
  });

  document.getElementById("ghBackupBtn").addEventListener("click", async () => {
    const { repo, token } = ghCreds();
    ghFlash("Backing up...", true);
    try {
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${GH_BACKUP_PATH}`;
      // Check for existing file to get its sha (required to update rather than create)
      let sha = null;
      const getRes = await fetch(apiUrl, { headers: { Authorization: `Bearer ${token}` } });
      if (getRes.status === 200) {
        const getData = await getRes.json();
        sha = getData.sha;
      } else if (getRes.status !== 404) {
        throw new Error(`Couldn't check existing file (status ${getRes.status}).`);
      }

      const payload = { entries, targets, backedUpAt: new Date().toISOString() };
      const body = {
        message: `Hours log backup — ${todayISO()}`,
        content: utf8ToBase64(JSON.stringify(payload, null, 2)),
      };
      if (sha) body.sha = sha;

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!putRes.ok) {
        const errData = await putRes.json().catch(() => ({}));
        throw new Error(errData.message || `Backup failed (status ${putRes.status}).`);
      }
      ghFlash(`Backed up ${entries.length} entries to ${repo}.`, true);
    } catch (err) {
      ghFlash(err.message || "Backup failed. Check your token and repo name.", false);
    }
  });

  document.getElementById("ghRestoreBtn").addEventListener("click", async () => {
    const { repo, token } = ghCreds();
    if (!confirm("This will merge entries from your GitHub backup into this device. Continue?")) return;
    ghFlash("Restoring...", true);
    try {
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${GH_BACKUP_PATH}`;
      const res = await fetch(apiUrl, { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 404) { ghFlash("No backup found in that repo yet.", false); return; }
      if (!res.ok) throw new Error(`Restore failed (status ${res.status}).`);
      const data = await res.json();
      const payload = JSON.parse(base64ToUtf8(data.content));

      const existingIds = new Set(entries.map(e => e.id));
      let added = 0;
      (payload.entries || []).forEach(e => {
        if (!existingIds.has(e.id)) { entries.push(e); added++; }
      });
      targets = Object.assign({}, targets, payload.targets || {});
      saveJSON(STORAGE_KEY, entries);
      saveJSON(TARGETS_KEY, targets);
      ghFlash(`Restored — added ${added} new ${added === 1 ? "entry" : "entries"}.`, true);
      render();
    } catch (err) {
      ghFlash(err.message || "Restore failed.", false);
    }
  });

  ghRefreshUI();
  render();
</script>
</body>
</html>
